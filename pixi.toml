[workspace]
authors = ["Joe Brown <jbrownuf07@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "kdigest"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test = "bash scripts/run_tests.sh"
fmt = "mojo format src/ test/ bench/"
build = "mojo precompile src/kdigest -o /tmp/kdigest.mojoc"
bench = "mojo run -I src bench/bench.mojo"
bench-gpu = "mojo run -I src bench/bench_gpu.mojo"

[dependencies]
mojo = ">=1.1.0,<2"
max = ">=26.6.0,<27"
