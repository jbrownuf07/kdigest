[workspace]
authors = ["Joe Brown <jbrown@grailbio.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "stream-fire"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test = "bash scripts/run_tests.sh"
fmt = "mojo format src/ test/"
build = "mojo build -I src src/stream_fire/__init__.mojo -o /dev/null"

[dependencies]
mojo = ">=1.1.0,<2"
